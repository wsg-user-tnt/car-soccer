<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Car Soccer — 1v1</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e17; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
#gameCanvas { display: block; width: 100%; height: 100%; }
#ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.hud { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 24px; align-items: center; background: rgba(0,0,0,0.55); padding: 8px 20px; border-radius: 12px; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); }
.score { font-size: 28px; font-weight: 700; min-width: 40px; text-align: center; }
.team-blue { color: #4da6ff; }
.team-orange { color: #ff8c42; }
#info { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 13px; opacity: 0.75; text-align: center; background: rgba(0,0,0,0.4); padding: 6px 14px; border-radius: 8px; }
#menu { position: absolute; inset: 0; background: radial-gradient(ellipse at center, #1a2332 0%, #0a0e17 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; gap: 12px; }
#menu h1 { font-size: 52px; font-weight: 800; background: linear-gradient(135deg, #4da6ff, #ff8c42); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; letter-spacing: -1px; }
#menu p { opacity: 0.7; margin-bottom: 20px; font-size: 15px; }
button { background: linear-gradient(135deg, #4da6ff, #2563eb); color: white; border: none; padding: 14px 32px; font-size: 17px; font-weight: 600; border-radius: 10px; cursor: pointer; transition: transform 0.1s, box-shadow 0.1s; box-shadow: 0 4px 20px rgba(77,166,255,0.35); min-width: 200px; }
button:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(77,166,255,0.5); }
button:active { transform: translateY(0); }
.hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
  <div class="hud">
    <span class="score team-blue" id="scoreBlue">0</span>
    <span style="opacity:0.5">—</span>
    <span class="score team-orange" id="scoreOrange">0</span>
  </div>
  <div id="info">WASD / Arrows to drive · Space boost · Click to start (sound enabled)</div>
</div>
<div id="menu">
  <h1>CAR SOCCER</h1>
  <p>Pure HTML5 Canvas · 1v1 (NetplayJS max) · High-quality graphics</p>
  <button id="startLocal">Play vs AI</button>
  <button id="startOnline">Play Online 1v1</button>
</div>
<script src="https://unpkg.com/netplayjs@0.4.1/dist/netplay.js"></script>
<script src="game.js"></script>
</body>
</html>
